<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071216"/>
      <stop offset="100%" stop-color="#0d242c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gradCol)"/>
  
  <g transform="translate(100, 90)">
    <rect width="600" height="320" rx="18" fill="#0b1b22" stroke="rgba(45,212,191,0.4)" stroke-width="2"/>
    <text x="300" y="65" fill="#2dd4bf" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" text-anchor="middle">Lumetri Color Grading &amp; Scopes</text>
    <text x="300" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" text-anchor="middle">S-Log to Rec.709 • Skin Tone Vector • Teal &amp; Orange Film Grades</text>

    <!-- Color Wheels / Scopes Graphic -->
    <g transform="translate(110, 130)">
      <!-- Shadows -->
      <circle cx="60" cy="65" r="45" fill="#071419" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="50" cy="72" r="8" fill="#38bdf8"/>
      <text x="60" y="130" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-anchor="middle">SHADOWS</text>

      <!-- Midtones -->
      <circle cx="190" cy="65" r="45" fill="#071419" stroke="#6366f1" stroke-width="2"/>
      <circle cx="192" cy="60" r="8" fill="#6366f1"/>
      <text x="190" y="130" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-anchor="middle">MIDTONES</text>

      <!-- Highlights -->
      <circle cx="320" cy="65" r="45" fill="#071419" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="330" cy="58" r="8" fill="#f59e0b"/>
      <text x="320" y="130" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-anchor="middle">HIGHLIGHTS</text>
    </g>
  </g>
</svg>
