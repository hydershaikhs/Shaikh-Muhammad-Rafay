<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#122744"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#netGrad)"/>
  <g transform="translate(80, 80)">
    <rect width="640" height="340" rx="16" fill="#0d1b30" stroke="rgba(0,210,255,0.3)" stroke-width="2"/>
    <text x="320" y="60" fill="#00d2ff" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" text-anchor="middle">Networking Basics &amp; Cyber Safety</text>
    <text x="320" y="95" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" text-anchor="middle">Star, Mesh &amp; Ring Topologies | OSI Model | Firewall Protection</text>
    
    <!-- Topology Nodes -->
    <g stroke="#00d2ff" stroke-width="2">
      <line x1="320" y1="210" x2="180" y2="180"/>
      <line x1="320" y1="210" x2="460" y2="180"/>
      <line x1="320" y1="210" x2="230" y2="280"/>
      <line x1="320" y1="210" x2="410" y2="280"/>
    </g>

    <!-- Center Hub -->
    <circle cx="320" cy="210" r="38" fill="#ff6b35" stroke="#fff" stroke-width="3"/>
    <text x="320" y="216" fill="#fff" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" text-anchor="middle">SWITCH</text>

    <!-- Clients -->
    <circle cx="180" cy="180" r="28" fill="#1e293b" stroke="#00d2ff" stroke-width="2"/>
    <text x="180" y="185" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" text-anchor="middle">PC 1</text>

    <circle cx="460" cy="180" r="28" fill="#1e293b" stroke="#00d2ff" stroke-width="2"/>
    <text x="460" y="185" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" text-anchor="middle">PC 2</text>

    <circle cx="230" cy="280" r="28" fill="#1e293b" stroke="#00d2ff" stroke-width="2"/>
    <text x="230" y="285" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" text-anchor="middle">SERVER</text>

    <circle cx="410" cy="280" r="28" fill="#1e293b" stroke="#00d2ff" stroke-width="2"/>
    <text x="410" y="285" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" text-anchor="middle">GATEWAY</text>
  </g>
</svg>
