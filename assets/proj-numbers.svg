<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#18233c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgNum)"/>
  <circle cx="200" cy="250" r="140" fill="#00d2ff" opacity="0.12" filter="blur(40px)"/>
  <circle cx="600" cy="250" r="160" fill="#ff6b35" opacity="0.12" filter="blur(40px)"/>
  
  <!-- Content -->
  <g transform="translate(100, 100)">
    <rect width="600" height="300" rx="16" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="40" y="70" fill="#00d2ff" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">01000010 01101001 01101110 01100001 01110010 01111001</text>
    <text x="40" y="130" fill="#ff6b35" font-family="'Outfit', sans-serif" font-weight="700" font-size="34">Number Systems &amp; Conversions</text>
    <text x="40" y="175" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18">Binary (Base 2) • Decimal (Base 10) • Octal (Base 8) • Hex (Base 16)</text>
    
    <g transform="translate(40, 210)">
      <rect width="160" height="50" rx="8" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5"/>
      <text x="80" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="16" text-anchor="middle">DEC: 255</text>
      
      <rect x="180" width="160" height="50" rx="8" fill="#1e293b" stroke="#ff6b35" stroke-width="1.5"/>
      <text x="260" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="16" text-anchor="middle">HEX: 0xFF</text>

      <rect x="360" width="160" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="440" y="32" fill="#fff" font-family="'Outfit', sans-serif" font-weight="600" font-size="16" text-anchor="middle">BIN: 1111 1111</text>
    </g>
  </g>
