<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="reelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f26"/>
      <stop offset="100%" stop-color="#24143d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#reelGrad)"/>
  
  <!-- Premiere Timeline Mock -->
  <g transform="translate(60, 60)">
    <rect width="680" height="380" rx="16" fill="#0f111a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    
    <!-- Top toolbar -->
    <rect width="680" height="50" rx="16" fill="#181c2b"/>
    <circle cx="30" cy="25" r="7" fill="#ef4444"/>
    <circle cx="50" cy="25" r="7" fill="#f59e0b"/>
    <circle cx="70" cy="25" r="7" fill="#10b981"/>
    <text x="340" y="32" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-weight="600" font-size="16" text-anchor="middle">Adobe Premiere Pro - Vertical Reel Edit (4K 60fps)</text>
    
    <!-- Video Player in Center -->
    <rect x="250" y="70" width="180" height="200" rx="12" fill="#000" stroke="#ff6b35" stroke-width="2"/>
    <polygon points="330,150 330,190 365,170" fill="#00d2ff"/>
    <text x="340" y="240" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">9:16 Viral Short</text>
    
    <!-- Timeline Tracks -->
    <g transform="translate(30, 290)">
      <rect width="620" height="24" rx="6" fill="#3b82f6" opacity="0.8"/>
      <text x="15" y="17" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">V2: Motion Typography &amp; B-Roll Overlays</text>
    </g>
    <g transform="translate(30, 320)">
      <rect width="620" height="24" rx="6" fill="#ff6b35" opacity="0.85"/>
      <text x="15" y="17" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">V1: Main Talking Head (4K S-Log Color Graded)</text>
    </g>
    <g transform="translate(30, 350)">
      <rect width="620" height="20" rx="6" fill="#10b981" opacity="0.75"/>
      <text x="15" y="15" fill="#fff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10">A1: Mastered Audio &amp; SFX Risers / Whooshes</text>
    </g>
  </g>
</svg>
