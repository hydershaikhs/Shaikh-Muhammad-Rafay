<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="osGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191326"/>
      <stop offset="100%" stop-color="#2c1a45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#osGrad)"/>
  <g transform="translate(90, 70)">
    <rect width="620" height="360" rx="16" fill="#130e20" stroke="#c084fc" stroke-width="2"/>
    <text x="310" y="55" fill="#c084fc" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" text-anchor="middle">Operating Systems &amp; Memory Hierarchy</text>
    <text x="310" y="88" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" text-anchor="middle">CPU Registers → Cache (L1/L2/L3) → RAM → Secondary Storage</text>
    
    <!-- Pyramid Hierarchy -->
    <polygon points="310,120 230,170 390,170" fill="#a855f7" stroke="#fff" stroke-width="1.5"/>
    <text x="310" y="152" fill="#fff" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">CPU Registers (Fastest)</text>

    <polygon points="225,175 165,230 455,230 395,175" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/>
    <text x="310" y="210" fill="#fff" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" text-anchor="middle">Cache Memory (L1, L2, L3)</text>

    <polygon points="160,235 100,290 520,290 460,235" fill="#6366f1" stroke="#fff" stroke-width="1.5"/>
    <text x="310" y="270" fill="#fff" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" text-anchor="middle">Primary RAM (Random Access)</text>

    <polygon points="95,295 40,350 580,350 525,295" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
    <text x="310" y="330" fill="#fff" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" text-anchor="middle">SSD / HDD (Secondary Storage - Capacity)</text>
  </g>
</svg>
