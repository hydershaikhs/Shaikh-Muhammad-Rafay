<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gradCom)"/>
  <circle cx="250" cy="250" r="140" fill="#4f46e5" opacity="0.18" filter="blur(50px)"/>
